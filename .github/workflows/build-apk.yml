name: Buat APK Drezz Chat
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [materialize.py, '.github/workflows/build-apk.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Siapkan proyek Android
        run: python3 materialize.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Siapkan Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Uji server LAN
        run: python3 DrezzLANChat/tests/test_chat.py
      - name: Kompilasi dan periksa APK
        run: gradle -p DrezzLANChat --no-daemon wrapper --gradle-version 8.9 :app:assembleDebug :app:lintDebug
      - name: Siapkan APK dan proyek lengkap
        run: |
          mkdir -p apk
          cp DrezzLANChat/app/build/outputs/apk/debug/app-debug.apk apk/Drezz-LAN-Chat-debug.apk
          cd apk
          sha256sum Drezz-LAN-Chat-debug.apk > SHA256SUMS.txt
          cd ..
          zip -qr Drezz-LAN-Chat-Source.zip DrezzLANChat -x '*/.gradle/*' '*/build/*' '*/tests/out/*' '*/local.properties'
      - uses: actions/upload-artifact@v4
        with:
          name: Drezz-LAN-Chat-APK
          path: apk/*
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: Drezz-LAN-Chat-Source
          path: Drezz-LAN-Chat-Source.zip
          if-no-files-found: error
          retention-days: 90
